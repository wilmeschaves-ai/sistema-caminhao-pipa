<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de Caminhão Pipa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            min-height: 100vh;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            overflow: hidden; /* Garante que a imagem respeita as bordas arredondadas */
        }
        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.15);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card login-card border-0 shadow-lg">
                    <!-- Imagem original exibida como banner no topo, sem cortes -->
                    <div class="w-100 bg-dark">
                        <img src="../frontend/images/wilmes2.png" alt="Dev Wilmes Banner" class="w-100" style="height: 160px; object-fit: cover; opacity: 0.9;">
                    </div>

                    <div class="p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h4 class="fw-bold text-dark mb-1">Sistema Pipa</h4>
                            <p class="text-muted small">Prefeitura Municipal de Jaramataia - AL</p>
                        </div>

                        <form id="formLogin">
                            <div class="mb-3">
                                <label for="login" class="form-label small fw-semibold text-secondary">E-mail / Login</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="login" required placeholder="wilmeschaves@gmail.com" autocomplete="username">
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="senha" class="form-label small fw-semibold text-secondary">Palavra-passe</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                    <input type="password" class="form-control border-start-0 ps-0" id="senha" required placeholder="********" autocomplete="current-password">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 fw-semibold py-2 shadow-sm">
                                <i class="fas fa-sign-in-alt me-2"></i> Entrar no Sistema
                            </button>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-4 text-white-50 small">
                    &copy; 2026 - Desenvolvido por Wilmes Dev
                </div>

            </div>
        </div>
    </div>

    <!-- Script de login -->
    <script src="js/login.js"></script>
</body>
</html>
