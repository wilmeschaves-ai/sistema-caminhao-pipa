<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Motoristas - Jaramataia - AL</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos personalizados (Marca d'água) -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navbar Principal -->
    <nav class="navbar navbar-dark bg-primary px-4 py-3 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap">
            
            <!-- Logo, Botão de Voltar e Título -->
            <div class="d-flex align-items-center">
                <a href="index.html" class="text-white me-3 fs-4 text-decoration-none"><i class="fas fa-arrow-left"></i></a>
                <img src="./images/avatar.jpg" alt="Logo" style="height: 42px; width: auto;" class="me-3 bg-white p-1 rounded">
                <span class="text-white fw-bold fs-5">👤 Gestão de Motoristas</span>
            </div>

            <!-- Links Rápidos de Navegação -->
            <div class="d-none d-lg-flex align-items-center gap-3 my-2 my-lg-0">
                <a href="index.html" class="text-white text-decoration-none small fw-semibold"><i class="fas fa-home me-1"></i> Início</a>
                <a href="caminhoes.html" class="text-white text-decoration-none small fw-semibold"><i class="fas fa-truck me-1"></i> Caminhões</a>
                <a href="motoristas.html" class="text-white text-decoration-none small fw-semibold text-warning"><i class="fas fa-id-card me-1"></i> Motoristas</a>
                <a href="beneficiarios.html" class="text-white text-decoration-none small fw-semibold"><i class="fas fa-users me-1"></i> Beneficiários</a>
                <a href="carregamentos.html" class="text-white text-decoration-none small fw-semibold"><i class="fas fa-water me-1"></i> Carregamento</a>
                <a href="entregas.html" class="text-white text-decoration-none small fw-semibold"><i class="fas fa-hand-holding-water me-1"></i> Entregas</a>
                <a href="relatorios.html" class="text-white text-decoration-none small fw-semibold"><i class="fas fa-file-alt me-1"></i> Relatórios</a>
                <a href="dashboards.html" class="text-white text-decoration-none small fw-semibold"><i class="fas fa-chart-pie me-1"></i> Dashboards</a>
            </div>

            <!-- Relógio Atual -->
            <div class="text-white small bg-white bg-opacity-10 px-3 py-1 rounded-pill d-none d-md-flex align-items-center">
                <i class="far fa-clock me-2"></i>
                <span id="relogio-atual">A carregar...</span>
            </div>

        </div>
    </nav>

    <!-- Conteúdo Principal -->
    
    <div class="container px-2 px-md-4 my-4">    
        <div class="row g-4">
            <!-- Formulário de Registo -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h5 class="fw-bold mb-3 text-success"><i class="fas fa-user-plus me-2"></i>Novo Motorista</h5>
                    <form id="formMotorista">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nome Completo</label>
                            <input type="text" id="nome" class="form-control rounded-pill px-3" required placeholder="Ex: João da Silva">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">CNH</label>
                            <input type="text" id="cnh" class="form-control rounded-pill px-3" required placeholder="Número da CNH">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Validade da CNH</label>
                            <input type="date" id="validade_cnh" class="form-control rounded-pill px-3" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Telefone</label>
                            <input type="text" id="telefone" class="form-control rounded-pill px-3" placeholder="(82) 99999-9999">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Caminhão Atribuído</label>
                            <select id="caminhao_id" class="form-select rounded-pill px-3">
                                <option value="">Nenhum / Sem Caminhão</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="fotoMotorista" class="form-label">Foto do Motorista</label>
                            <input type="file" class="form-control" id="fotoMotorista" accept="image/*">
                        </div>

                        <button type="submit" class="btn btn-success rounded-pill w-100 fw-semibold py-2 shadow-sm text-white">
                            <i class="fas fa-save me-2"></i>Guardar Motorista
                        </button>
                    </form>
                </div>
            </div>

            <!-- Tabela de Listagem -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h5 class="fw-bold mb-3 text-success"><i class="fas fa-id-card me-2"></i>Motoristas</h5>
                    <div class="table-responsive">
                        <table class="table table-hover table-sm align-middle mb-0" style="font-size: 0.85rem;">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 50px;" class="ps-3">Foto</th>            
                                    <th>Nome</th>
                                    <th class="text-nowrap">Celular</th>
                                    <th>CNH</th>
                                    <th class="text-nowrap">Validade</th>
                                    <th>Status</th>
                                    <th>Caminhão</th>
                                    <th class="text-center pe-3" style="width: 90px;">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaMotoristas">
                                <!-- Os dados entram aqui via JavaScript -->
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/motoristas.js"></script>
    <script>
        function atualizarRelogio() {
            const agora = new Date();
            const data = agora.toLocaleDateString('pt-PT', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
            const hora = agora.toLocaleTimeString('pt-PT');
            document.getElementById('relogio-atual').textContent = `${data} | ${hora}`;
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();
    </script>
</body>
</html>
